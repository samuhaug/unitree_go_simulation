controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    leg_position_controller:
      type: position_controllers/JointGroupPositionController
leg_position_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_upper_leg_joint
      - FL_lower_leg_joint
      - FR_hip_joint
      - FR_upper_leg_joint
      - FR_lower_leg_joint
      - RL_hip_joint
      - RL_upper_leg_joint
      - RL_lower_leg_joint
      - RR_hip_joint
      - RR_upper_leg_joint
      - RR_lower_leg_joint

